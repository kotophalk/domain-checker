<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whois Checker (.RU & others)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; }
        textarea { width: 100%; height: 150px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; resize: vertical; margin-bottom: 15px; font-family: monospace; font-size: 14px; }
        button { background: #3498db; color: white; border: none; padding: 12px 20px; font-size: 16px; cursor: pointer; border-radius: 4px; width: 100%; transition: background 0.3s; }
        button:hover { background: #2980b9; }
        button:disabled { background: #95a5a6; cursor: not-allowed; }
        .results { margin-top: 25px; }
        .result-item { padding: 12px; margin-bottom: 8px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; background: #ecf0f1; border-left: 5px solid #bdc3c7; }
        .result-item.free { background: #e8f8f5; border-left-color: #2ecc71; color: #27ae60; font-weight: bold; }
        .result-item.taken { background: #fdf2e9; border-left-color: #e74c3c; color: #c0392b; }
        .result-item.error { background: #fef9e7; border-left-color: #f1c40f; color: #f39c12; }
        .spinner { display: none; margin: 10px auto; width: 30px; height: 30px; border: 3px solid rgba(0,0,0,0.1); border-radius: 50%; border-top-color: #3498db; animation: spin 1s ease-in-out infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>Проверка доменов</h1>
        <p>Введите домены (каждый с новой строки или через запятую). Зона .ru поддерживается.</p>
        <textarea id="domainsInput" placeholder="example.ru&#10;test-domain-123.com&#10;kotophalk-seo.ru"></textarea>
        <button id="checkBtn" onclick="checkDomains()">Проверить</button>
        <div class="spinner" id="spinner"></div>
        <div class="results" id="results"></div>
    </div>

    <script>
        function escapeHtml(unsafe) {
            return (unsafe || '').toString()
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        async function checkDomains() {
            const input = document.getElementById('domainsInput').value;
            const btn = document.getElementById('checkBtn');
            const spinner = document.getElementById('spinner');
            const resultsDiv = document.getElementById('results');
            
            if (!input.trim()) return;
            
            const domains = input.split(/[\n,]+/).map(d => d.trim()).filter(d => d.length > 3);
            if (domains.length === 0) return;

            btn.disabled = true;
            spinner.style.display = 'block';
            resultsDiv.innerHTML = '';
            
            try {
                // We send a GET request with comma separated domains
                const query = domains.join(',');
                const response = await fetch(`/api/check?domains=${encodeURIComponent(query)}`);
                const data = await response.json();
                
                data.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'result-item';
                    
                    const safeDomain = escapeHtml(item.domain);
                    const safeError = escapeHtml(item.error);

                    if (item.error) {
                        div.classList.add('error');
                        div.innerHTML = `<span>${safeDomain}</span><span>Ошибка: ${safeError}</span>`;
                    } else if (item.free) {
                        div.classList.add('free');
                        div.innerHTML = `<span>${safeDomain}</span><span>Свободен ✅</span>`;
                    } else {
                        div.classList.add('taken');
                        div.innerHTML = `<span>${safeDomain}</span><span>Занят ❌</span>`;
                    }
                    
                    resultsDiv.appendChild(div);
                });
            } catch (error) {
                resultsDiv.innerHTML = `<div class="result-item error">Ошибка соединения с сервером</div>`;
            } finally {
                btn.disabled = false;
                spinner.style.display = 'none';
            }
        }
    </script>
</body>
</html>
